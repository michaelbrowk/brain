name: Full E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    runs-on: ubuntu-24.04
    # The exhaustive suite stays available for deliberate manual QA and one
    # weekly regression pass. Main releases use the compact @release gate in
    # the separate artifact-producing CI workflow.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install runtime search dependency
        run: bash scripts/bootstrap-runtime-search.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Each runner owns its notes/state root. Keep Playwright's single worker:
      # test files reset the shared fixture and cannot run concurrently there.
      # Stop before the job deadline so failures retain their diagnostic files.
      - run: pnpm test:e2e:full --shard=${{ matrix.shard }}/4 --global-timeout=1200000 --reporter=github,html
      - name: Preserve failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
