# Release smoke for the same web/mail/MIME topology as the onboarding file.
# Credentials are deliberately not pre-seeded: bootstrap must create the key.
services:
  web:
    image: ${BRAIN_SMOKE_IMAGE:?set BRAIN_SMOKE_IMAGE}
    command: ["web"]
    init: true
    depends_on: [mail]
    ports:
      - "127.0.0.1:${BRAIN_SMOKE_PORT:-3023}:3020"
    environment:
      AUTH_SECRET: brain-compose-smoke-secret-not-for-production-0123456789
      AUTH_PASSWORD_HASH: ${BRAIN_SMOKE_PASSWORD_HASH:?set BRAIN_SMOKE_PASSWORD_HASH}
      MCP_TOKEN: brain-compose-smoke-mcp-token-not-for-production
      BRAIN_READINESS_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      BRAIN_EDGE_RATE_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      BRAIN_PUBLIC_ORIGIN: http://127.0.0.1:3020
      BRAIN_UPDATE_CHECK: "off"
      OPENROUTER_API_KEY: ""
      GIT_AUTHOR_NAME: Brain Smoke
      GIT_AUTHOR_EMAIL: brain-smoke@example.invalid
      GIT_COMMITTER_NAME: Brain Smoke
      GIT_COMMITTER_EMAIL: brain-smoke@example.invalid
    volumes:
      - notes:/opt/brain/notes
      - brain-state:/var/lib/brain
      - mail-socket:/run/brain-mail
  mail:
    image: ${BRAIN_SMOKE_IMAGE:?set BRAIN_SMOKE_IMAGE}
    command: ["mail"]
    init: true
    depends_on: [mail-mime]
    volumes:
      - mail-state:/var/lib/brain-mail
      - mail-credentials:/run/credentials/brain-mail
      - mail-socket:/run/brain-mail
      - mail-mime-socket:/run/brain-mail-mime

  mail-mime:
    image: ${BRAIN_SMOKE_IMAGE:?set BRAIN_SMOKE_IMAGE}
    command: ["mail-mime"]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Two one-message children (128 MiB JS heap each), bounded as one pool.
    mem_limit: 384m
    cpus: 0.4
    pids_limit: 32
    ulimits:
      nofile: 64
      core: 0
    volumes:
      # Intentionally no credentials, mail state, notes, or host network.
      - mail-mime-socket:/run/brain-mail-mime

volumes:
  notes: {}
  brain-state: {}
  mail-state: {}
  mail-credentials: {}
  mail-socket: {}
  mail-mime-socket: {}
