packages:
  - "workers/*"

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# pdfjs-dist lists @napi-rs/canvas as an optional dependency for drawing pages
# under Node. Brain runs pdf.js only in the browser (the mail attachment
# viewer), so the native canvas and its per-platform binaries would be weight
# in every install that nothing loads.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# Security floors (audits 2026-08-19, 2026-09-21, 2026-10-04): parents of these
# transitive deps pin vulnerable ranges. Selectors are version-scoped so future
# majors are never hijacked. postcss stays an exact pin (was 8.5.16 since the
# July reliability rollout), bumped along the same 8.5.x line.
#
# The 2026-09-21 additions, and why each is a floor rather than a parent bump:
# nodemailer is pinned to 9.0.3 by both imapflow@1.4.7 and mailparser@3.9.14,
# and those two versions are frozen by patches/ and by the pinned-package
# assertions in scripts/build-mail-service.mjs, so the parents cannot move
# without porting the MIME hardening patches. fast-uri reaches us through ajv
# inside @modelcontextprotocol/sdk@1.26.0, which mcp-handler@1.1.0 pins exactly.
# browserslist arrives via styled-jsx > @babel/core inside next. deepmerge-ts
# comes from html-to-text@10.0.0 under mailparser; html-to-text@10.0.1 pairs
# itself with deepmerge-ts ^8.0.1, so 8.x is the combination upstream ships.
#
# The last three close the moderate findings from the same audit. Each sits
# inside a range its parent already declares, so the floor only lifts a
# resolution the lockfile had frozen low. hono is the one that matters most:
# it is the HTTP layer of @modelcontextprotocol/sdk, and /api/mcp is a route
# this app serves, so GHSA-crvj-82cr-hjcx (a query-parser cache-key and proxy
# interpretation differential) is reachable rather than theoretical.
#
# The 2026-10-04 raises, from the day the audit gate went red on every branch
# at once. nodemailer goes from 10.0.2 to 10.0.9, a floor for the reason given
# above: 10.0.5 and 10.0.6 make two quadratic walks in its addressparser linear
# (GHSA-prgh-xp8r-p3m5, GHSA-v53p-9fqp-m79j), and mailparser hands that parser
# the address headers of inbound mail, so both sat on the path of every letter
# received. 10.0.9 stops the text after a comment from riding into a quoted
# local-part address (GHSA-g57g-f23g-4646). hono goes to 4.13.7 for
# GHSA-hxh3-vqpv-xpqv, still inside the ^4 its parents declare. dompurify is new
# in this list: @milkdown declares ^3.2.5 and isomorphic-dompurify ^3.4.12, the
# lockfile had frozen 3.4.13, and 3.4.16 closes GHSA-p98j-92pf-mc4p inside both
# ranges.
#
# The 2026-10-07 floors, from the second day the gate went red everywhere.
# prosemirror-view goes to 1.42.3, which runs attribute validators on the
# attributes a pasted slice carries (GHSA-c8x8-7fp4-3x9w, script from pasted
# HTML): that is the editor itself, inside the ^1.41.3 @milkdown/prose
# declares. vue goes to 3.5.42 because vue pins its @vue/* packages exactly,
# so the floor on vue is what moves @vue/server-renderer past GHSA-g2v6-rqmx-r4w6;
# it arrives through @milkdown/components, which declares ^3.5.20, and Brain
# never renders Vue on the server. source-map-js goes to 1.2.2 inside the ^1.2.1
# of @vue/compiler-core. sharp goes to 0.35.5 for the librsvg it bundles
# (GHSA-wq5f-xc86-pv6w), inside the ^0.35.4 that next and package.json declare.
# @modelcontextprotocol/sdk is the one floor against its parent: mcp-handler@1.1.0
# pins 1.26.0 exactly, and every later mcp-handler is built on the 2.x server
# package instead. GHSA-6qxp-vccf-f47h is in the SDK's OAuth client, which Brain
# never loads (mcp-handler imports only server/* and shared/auth), so the floor
# is for the gate rather than for exposure. 1.30.1 also gave the SDK's HTTP
# transport a 4 MiB body limit that mcp-handler cannot configure, under the
# 16 MiB the /api/mcp route allows for app pages, which is why
# patches/mcp-handler@1.1.0.patch hands the transport the body mcp-handler has
# already parsed. sprintf-js (moderate, under argparse ~1.0.2 with no fixed
# release) and katex (low, fixed only in 0.18.2, outside the ^0.16 and ^0.17
# its parents declare) stay as they are.
overrides:
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": 1.31.0
  "baseline-browser-mapping@>=2.0.0 <2.11.0": 2.11.0
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  "browserslist@>=4.0.0 <4.28.7": 4.28.7
  "deepmerge-ts@>=7.0.0 <8.0.0": 8.0.2
  "dompurify@>=3.0.0 <3.4.16": 3.4.16
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "hono@>=4.0.0 <4.13.7": 4.13.7
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "nodemailer@>=5.0.0 <10.0.9": 10.0.9
  postcss: 8.5.26
  "prosemirror-view@>=1.0.0 <1.42.3": 1.42.3
  "qs@>=6.0.0 <6.16.0": 6.16.0
  "sharp@>=0.35.0 <0.35.5": 0.35.5
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "undici@>=7.0.0 <7.29.0": 7.29.0
  "undici@>=8.0.0 <8.10.2": 8.10.2
  "vue@>=3.5.0 <3.5.42": 3.5.42
patchedDependencies:
  '@zone-eu/mailsplit@5.4.14': patches/@zone-eu__mailsplit@5.4.14.patch
  mailparser@3.9.14: patches/mailparser@3.9.14.patch
  # mcp-handler parses the body, then rebuilds a request the SDK transport
  # reads again under its own 4 MiB default. The patch hands the transport the
  # parsed body, so /api/mcp's 16 MiB cap is the one that applies.
  mcp-handler@1.1.0: patches/mcp-handler@1.1.0.patch
  # parse5 found a duplicate attribute by scanning every attribute before it,
  # so one tag of 200,000 attributes cost the mail sanitizer most of a minute.
  # The patch keeps the current tag's names in a Set.
  parse5@8.0.1: patches/parse5@8.0.1.patch
