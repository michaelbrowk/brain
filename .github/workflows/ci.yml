name: CI

on:
  # Every merge runs the gate, the build, and both smokes. Releases are cut by
  # pnpm release and built by release.yml; this workflow produces no artifact.
  push:
    branches: [main]
  # PRs run the cheap gate: `pnpm install`, the ripgrep install, the gitleaks
  # scan of the working tree, and `pnpm check`. Every build/browser/packaging/
  # systemd-verify step below is guarded `if: github.event_name == 'push'`, so
  # a pull request never boots a browser. Restores a required status check
  # without paying for packaging on every push (audit 2026-08-19).
  pull_request:
    branches: [main]
    # Prose and pictures the gate never opens. A pull request is skipped only
    # when every file it changes matches one of these, so the ordinary case —
    # a re-captured screenshot alongside the code that changed it — still runs
    # the whole gate.
    #
    # `docs/**` and `**/*.md` are deliberately not here. `pnpm check` reads
    # five files under docs/ (`operations.md`, `gmail-oauth.md`,
    # `mail-architecture.md`, and both mail operations guides) and
    # `lib/notion/__fixtures__/structured.md` is a round-trip fixture; ignoring
    # those would let a change to a gate input merge ungated.
    paths-ignore:
      - "docs/design/**"
      - "AGENTS.md"
      - "DESIGN.md"
      - "PRODUCT.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install runtime search dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install release verification dependencies
        if: github.event_name == 'push'
        run: sudo apt-get install --yes acl shellcheck nginx
      - run: pnpm install --frozen-lockfile
      - name: Verify operational contracts
        if: github.event_name == 'push'
        run: bash scripts/verify-ops.sh
      - name: Scan for secrets
        # Scans the working tree, not git history: the public repository is
        # a single initial commit, so the tree is the whole story.
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -fsSL "${base}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          # A scanner that runs whatever the network handed it is not a gate.
          # --ignore-missing skips the other platforms' entries; it still fails
          # if nothing was verified. On macOS: shasum -a 256 -c --ignore-missing
          (cd /tmp && sha256sum --check --ignore-missing gitleaks-checksums.txt)
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --config .gitleaks.toml
      - name: Check type safety, tests, round-trips, and worker
        run: pnpm check
      - name: Install release browser
        if: github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run compact release browser gate
        if: github.event_name == 'push'
        run: pnpm test:e2e:release
      - name: Set build provenance
        if: github.event_name == 'push'
        run: |
          echo "BRAIN_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BRAIN_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: pnpm build
        if: github.event_name == 'push'
      - run: pnpm smoke:standalone
        if: github.event_name == 'push'
      - run: pnpm smoke:mail-service
        if: github.event_name == 'push'
