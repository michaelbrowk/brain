name: Feature request
description: Something Brain should do and does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Brain is maintained by one person, so the narrow requests are the ones
        that land. Anything that moves the architecture belongs in
        [Discussions](https://github.com/michaelbrowk/brain/discussions) first:
        `PRODUCT.md` holds the constraints those parts answer to, and a pull
        request that argues with them is a slow way to find that out.
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The situation you hit, before any solution to it.
      placeholder: |
        I keep a page per client and I cannot tell at a glance which ones I
        have not written in this month.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What Brain could do about it
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you get by today
      description: >
        The workaround, or another tool doing it. It says how much the change is
        worth.
    validations:
      required: false
